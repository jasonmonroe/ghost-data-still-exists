[pytest]
# Imports are rooted at code/ (e.g. `from agents.evidence_agent import ...`).
pythonpath = code
testpaths = code/tests
# Default (prepend) import mode: every test file needs a UNIQUE basename.
# Don't use --import-mode=importlib: it registers a fake `code` package
# (from the code/ folder) that shadows the stdlib `code` module pytest needs.
addopts = -ra
markers =
    slow: end-to-end runs over the real sample dataset (deselect with -m "not slow")
filterwarnings =
    ignore::DeprecationWarning
